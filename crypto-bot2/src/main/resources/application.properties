# ============================================================
# crypto-bot2 メイン設定ファイル
# 機密情報（API KEY/SECRET）は secret.properties に記載する
# ============================================================

# --- アプリ設定 ---
spring.application.name=crypto-bot2

# secret.properties を追加で読み込む（Git除外済み）
spring.config.import=optional:classpath:secret.properties

# --- DB設定 ---  PORT: 本番サーバ 5432  開発機 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/VirtualCurrency
spring.datasource.username=postgres
spring.datasource.password=Hid54103
spring.datasource.driver-class-name=org.postgresql.Driver

# DB接続プール（HikariCP デフォルト）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# スキーマ自動作成（初回起動時に schema.sql を実行）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- GMOコイン API ---
gmo.api.base-url=https://api.coin.z.com/public

# 取得対象の通貨（カンマ区切りで複数指定可）
# 選択肢: BTC / ETH / BCH / LTC / XRP / XEM / XLM / BAT / OMG / XTZ / QTUM / ENJ / DOT / ATOM / MKR / DAI
# ※ レバレッジ取引の場合は _JPY 形式を使用すること
gmo.kline.symbols=BTC_JPY

# 取得インターバル（GMO API の interval パラメータ値）
# 選択肢: 1min / 5min / 10min / 15min / 30min / 1hour / 4hour / 8hour / 12hour / 1day / 1week / 1month
gmo.kline.interval=10min

# --- スケジューラ設定 ---
# cron 式（Spring 形式: 秒 分 時 日 月 曜）
# 例: 0 0 * * * * = 毎時0分0秒
gmo.scheduler.cron=1 */10 * * * *
gmo.scheduler.timezone=Asia/Tokyo

# --- API呼び出し設定 ---
gmo.api.retry.max-attempts=3
gmo.api.retry.delay-ms=1000

gmo.api.timeout.connect-ms=5000
gmo.api.timeout.read-ms=10000

# --- 自動売買スケジューラ ---
# cron 式（Spring 形式: 秒 分 時 日 月 曜）
# 例: 0 */5 * * * * = 10分ごと
gmo.scheduler.trade-cron=2 */10 * * * *

# --- 自動売買設定（レバレッジ取引）---
# true=ペーパートレード（模擬売買） / false=本番売買
gmo.trade.paper-mode=true

# 発注数量（BTC単位）※レバレッジは数量指定
gmo.trade.size=0.1

# 損切りライン（%）
gmo.trade.stop-loss-percent=3

# 利確ライン（%）
gmo.trade.take-profit-percent=3

# ポジション重複防止
gmo.trade.position-management=true

# レバレッジ銘柄コードのサフィックス（BTC → BTC_JPY）
gmo.trade.leverage-symbol-suffix=_JPY

# --- 指標設定 --- 27-73
# RSI
gmo.indicator.rsi-period=9
gmo.indicator.rsi-oversold=27.0
gmo.indicator.rsi-overbought=73.0

# MACD  4-24-9 5-20-9
gmo.indicator.macd-fast-period=4
gmo.indicator.macd-slow-period=24
gmo.indicator.macd-signal-period=9

# DMI（DI期間14 / ADX平滑化期間3）
gmo.indicator.dmi-period=14
gmo.indicator.dmi-adx-threshold=21.0
gmo.indicator.adx-period=3

# RCI（期間5）
gmo.indicator.rci-period=5
gmo.indicator.rci-oversold=-90.0
gmo.indicator.rci-overbought=90.0

# TEMA（短期9 / 長期24）
gmo.indicator.tema-fast-period=5
gmo.indicator.tema-slow-period=9

# TEMA 乖離率しきい値（%）: (FAST-SLOW)/FAST*100 が +N% 以上→SELL / -N% 以下→BUY
gmo.indicator.tema-divergence-threshold-percent=0.03

# DB から取得するローソク足の最大件数
gmo.indicator.price-history-size=100

# --- ログ設定 ---
logging.level.com.example.cryptobot2=INFO
logging.level.org.springframework.jdbc=WARN

# --- バックテスト設定 ---
# 開始日・終了日は起動引数で指定する
# 例: java -jar crypto-bot2.jar --backtest --start-date=2024-01-01 --end-date=2024-12-31
gmo.backtest.initial-balance-jpy=1000000
