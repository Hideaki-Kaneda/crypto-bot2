# ============================================================
# secret.properties — 暗号化済み API KEY/SECRET
# ★ このファイルは .gitignore で Git 管理から除外すること
# ★ 暗号化には scripts/encrypt-secrets.sh を使用する
# ============================================================

# GMOコイン API KEY（ENC(...) 形式で暗号化済み）
# 未設定の場合は KLine 取得（Public API）のみ動作する
gmo.api.key=ENC(xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx)
gmo.api.secret=ENC(yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy)
